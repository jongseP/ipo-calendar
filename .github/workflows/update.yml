name: update ipos

on:
  schedule:
    - cron: "0 22,3,9 * * *"   # KST 07, 12, 18시
  workflow_dispatch:

permissions:
  contents: write

# 예약 실행과 수동 실행이 겹치지 않게
concurrency:
  group: update-ipos
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tests/test_parse.py
      - run: node tests/test_view.mjs
      - run: python fetch_ipos.py
      - name: commit if changed
        run: |
          git diff --quiet data/ipos.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ipos.json
          git commit -m "chore: update ipos"
          git pull --rebase
          git push
